name: Actualizar datos de carbono (Ember)

on:
  schedule:
    - cron: '17 6 2 * *'   # el día 2 de cada mes, 06:17 UTC
  workflow_dispatch:
  push:
    paths: ['scripts/update-data.mjs', '.github/workflows/update-data.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-data.mjs
      - name: Guardar cambios
        run: |
          if git diff --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "wattprint-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Datos de carbono actualizados desde Ember ($(date -u +%Y-%m-%d))"
          git push
